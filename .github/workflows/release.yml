name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Create Archive
      run: |
        tar -czvf robot_charger.tar.gz *.py requirements.txt README.md Makefile Dockerfile docker-compose.yml tests/
        
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: robot_charger.tar.gz
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}